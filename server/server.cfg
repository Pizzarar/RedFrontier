# RedFrontier server config (tracked). Secrets live in secrets.cfg (untracked).
exec secrets.cfg
# Access (B-access). Both gitignored; tools/lib.ps1 Initialize-AccessCfgs creates them empty if missing.
# admins.cfg: owner, written by fh_core auto-admin. allowlist.cfg: friends, written by fh_allow. Delete a line + restart to revoke.
exec admins.cfg
exec allowlist.cfg

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 6
# Unlisted: not announced to the public server list. Friends connect by IP over NordVPN Meshnet.
sv_master1 ""
sv_hostname "RedFrontier (dev)"

set gamename rdr3
# Build required by the pinned RSG recipe (Rexshack-RedM/txAdminRecipe)
set sv_enforceGameBuild 1491
set onesync on

setr rsg_locale "en"
setr ox:locale en
setr ox:primaryColor red
setr ox:primaryShade 8
setr UseTarget false
set mysql_slow_query_warning 300
# Dev: replicated convar. Clients report script errors to the server (fh:dev:clientError -> server/logs/client-errors.log). Set 0 for public.
setr fh_dev 1
# private dev server only: the first player to join (while admins.cfg has no admin) becomes group.admin. Set 0 for public.
set fh_dev_autoadmin 1
# Spikes gate (plan core-01 Amendment 2026-11-22 autonomy). true = conservative path until S1/S2 report: when a spawned
# entity's spawner/owner client drops, fh_core despawns it and re-requests it from another client (no reliance on
# ownership migration or SetEntityOrphanMode). Flip to false once spk_camp RESULT is GO. Full list: fh_core/docs/spike-gated.md
set fh_spike_gated true

# --- resources (order matters) ---
ensure mapmanager
ensure spawnmanager
ensure oxmysql
ensure ox_lib
ensure rsg-core
# fh_inventory is the rsg-inventory fork (provides rsg-inventory); it loads fh_core rule modules, so fh_core first
ensure fh_core
ensure fh_inventory
ensure rsg-target
ensure rsg-weather
ensure rsg-chat
ensure rsg-loading
ensure rsg-character
# FrontierHomestead resources go here (server/resources/[fh]); fh_core is ensured above
ensure fh_economy
ensure fh_buffs
ensure fh_homestead
ensure fh_zones
ensure fh_death
ensure fh_ui
ensure fh_hunting
ensure fh_quests
ensure fh_tutorial
ensure fh_progression
ensure fh_fence
ensure fh_hands
ensure fh_cargo
ensure fh_heat
ensure fh_crafting
ensure fh_gunsmith
ensure fh_survival
ensure fh_trade

# permissions: console/rcon may run anything
add_ace group.admin command allow
# rsg-core admin checks (HasPermission 'admin', rsgcore.admin command aces; rsg-core/server/commands.lua:18,54) pass for group.admin
add_principal group.admin rsgcore.admin
# Allowlist: rsg-core whitelist (RSGConfig.Server.WhitelistPermission = 'fh.allowlist') admits anyone with this ace.
# Friends: add_principal identifier.license:<hash> group.fh_allowlist (allowlist.cfg). Admins inherit it.
add_ace group.fh_allowlist fh.allowlist allow
add_principal group.admin group.fh_allowlist
# rsg-core and ox_lib run these ACL commands from ExecuteCommand as themselves, so without the grants the
# console spams "Access denied for command add_ace" at boot. Granted only what they call:
#   rsg-core/server/commands.lua:18,47,54 (add_ace), server/functions.lua:585,599,605 (add/remove_principal)
#   ox_lib/resource/acl/server.lua:19,28,37,46 (add/remove_ace, add/remove_principal)
add_ace resource.rsg-core command.add_ace allow
add_ace resource.rsg-core command.add_principal allow
add_ace resource.rsg-core command.remove_principal allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
